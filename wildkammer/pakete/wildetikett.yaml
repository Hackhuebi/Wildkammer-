    - id: wild_sprache_befehle
      alias: "Wild-Sprache: Storno, nochmal, neues Stück"
      mode: queued
      triggers:
        - trigger: conversation
          id: storno
          command:
            - "storno"
            - "(stornieren|das war falsch)"
        - trigger: conversation
          id: nochmal
          command:
            - "(nochmal|noch mal|wiederholen)"
            - "nochmal drucken"
        - trigger: conversation
          id: neues_stueck
          command:
            - "(neues|nächstes) (stück|tier)"
      actions:
        - choose:
            - conditions: "{{ trigger.id == 'storno' }}"
              sequence:
                - action: script.wild_sprache_storno
                  response_variable: r
                - set_conversation_response: >-
                    {{ r.code ~ ' storniert. Etikett wegwerfen.' if r.ok else 'Dafür gibt es gerade kein passendes Etikett.' }}
            - conditions: "{{ trigger.id == 'nochmal' }}"
              sequence:
                - action: script.wild_sprache_nochmal
                  response_variable: r
                - set_conversation_response: >-
                    {% if r.ok %}{{ r.teil }} nochmal.
                    {%- elif r.fehler == 'druck' %}Der Drucker hat nicht gedruckt.
                    {%- else %}Dafür gibt es gerade kein passendes Etikett.{% endif %}
            - conditions: "{{ trigger.id == 'neues_stueck' }}"
              sequence:
                - action: script.wild_sprache_neues_stueck
                  response_variable: r
                - set_conversation_response: >-
                    {{ 'Stück ' ~ r.stueck ~ ', ' ~ r.art ~ '.' if r.ok else 'Erst die Wildart sagen.' }}
