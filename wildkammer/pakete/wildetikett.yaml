# Wird vom Wildkammer-Add-on verwaltet und bei jedem Update überschrieben.
# Eigene Änderungen bitte nicht hier, sondern in einer anderen Datei machen.
# =====================================================================
# Wildkammer: Sprachbefehl -> Add-on -> Etikett auf dem B1
# Ablegen unter /config/packages/wildetikett.yaml
# Eingetragen sind die IP 192.168.178.60 und dein Drucker.
# =====================================================================

wildetikett:
  rest_command:
    wild_art:
      url: http://192.168.178.60:8099/api/wildart
      method: POST
      content_type: application/json
      payload: '{"art": "{{ art }}"}'
    wild_neues_stueck:
      url: http://192.168.178.60:8099/api/neues-stueck
      method: POST
    wild_anlegen:
      url: http://192.168.178.60:8099/api/anlegen
      method: POST
      content_type: application/json
      payload: '{"teil": "{{ teil }}", "gewicht_g": {{ gewicht_g | default(0) | int(0) }}}'
    wild_gedruckt:
      url: "http://192.168.178.60:8099/api/gedruckt/{{ nummer | int }}"
      method: POST
    wild_letztes:
      url: http://192.168.178.60:8099/api/letztes
      method: GET
    wild_storno:
      url: http://192.168.178.60:8099/api/storno
      method: POST
    wild_eingabe:
      url: http://192.168.178.60:8099/api/eingabe
      method: POST
      content_type: application/json
      payload: '{"gewicht": {{ gewicht | default("") | string | to_json }}, "menge": {{ menge | default("") | string | to_json }}}'
    wild_status:
      url: http://192.168.178.60:8099/api/status
      method: GET
    wild_bestand:
      url: "http://192.168.178.60:8099/api/bestand?teil={{ teil | default('') | urlencode }}"
      method: GET

  script:
    # ---------- Bausteine ----------
    wild_etikett_rendern:
      alias: "Wild: Etikett rendern"
      mode: queued
      max: 20
      fields:
        e: { description: "Etikettendaten aus dem Add-on" }
      sequence:
        - action: niimbot.print
          target:
            device_id: 9cea996fbc0962ebe6d27af33baf87e9
          data:
            width: 384
            height: 240
            density: 3
            payload:
              - type: text
                value: "{{ e.art }}"
                x: 8
                "y": 8
                size: 32
              - type: text
                value: "{{ e.teil }}"
                x: 8
                "y": 70
                # Lange Wörter kleiner, damit sie nicht in den QR-Code laufen.
                size: "{{ 46 if e.teil | length <= 8 else 34 }}"
              # Bleibt leer, wenn kein Gewicht genannt wurde.
              - type: text
                value: "{{ e.gewicht_text }}"
                x: 8
                "y": 134
                size: 26
              - type: text
                value: "{{ e.code }}"
                x: 8
                "y": 204
                size: 24
              - type: qrcode
                data: "http://192.168.178.60:8099/s/{{ e.nummer }}"
                x: 236
                "y": 44
                boxsize: 4
                border: 4
                eclevel: m
              - type: text
                value: "{{ e.datum }}"
                x: 244
                "y": 204
                size: 24
        - variables:
            fertig:
              gedruckt: true
        - stop: "Gedruckt"
          response_variable: fertig

    # ---------- Für die Routinen ----------
    wild_drucken:
      alias: "Wild: Etikett drucken und einbuchen"
      mode: queued
      max: 20
      fields:
        teil: { description: "Teilstück" }
      sequence:
        - action: rest_command.wild_anlegen
          data:
            teil: "{{ teil }}"
          response_variable: antwort
        - if: "{{ not antwort.content.ok }}"
          then:
            # Ohne Wildart kommt die Rückmeldung als Etikett.
            - action: niimbot.print
              target:
                device_id: 9cea996fbc0962ebe6d27af33baf87e9
              data:
                width: 384
                height: 240
                density: 3
                payload:
                  - type: text
                    value: "WILDART"
                    x: 20
                    "y": 50
                    size: 60
                  - type: text
                    value: "FEHLT"
                    x: 20
                    "y": 125
                    size: 60
            - stop: "Keine Wildart gesetzt"
        # Der B1 meldet manchmal einen Fehler, obwohl gedruckt wurde: trotzdem einbuchen.
        - action: script.wild_etikett_rendern
          data:
            e: "{{ antwort.content }}"
          continue_on_error: true
        - action: rest_command.wild_gedruckt
          data:
            nummer: "{{ antwort.content.nummer }}"

    wild_neues_stueck:
      alias: "Etikett neues Stück"
      mode: queued
      sequence:
        - action: rest_command.wild_neues_stueck

    wild_storno:
      alias: "Etikett Storno"
      mode: queued
      sequence:
        - action: rest_command.wild_storno

    wild_nochmal:
      alias: "Etikett nochmal"
      mode: queued
      sequence:
        - action: rest_command.wild_letztes
          response_variable: antwort
        - condition: "{{ antwort.content.ok }}"
        - action: script.wild_etikett_rendern
          data:
            e: "{{ antwort.content }}"

    # ---------- Für Assist: Diese Skripte melden das Ergebnis zurück ----------
    wild_sprache_etikett:
      alias: "Wild-Sprache: Etikett"
      mode: queued
      max: 20
      fields:
        teil: { description: "Teilstück" }
        gewicht_g: { description: "Gramm, optional" }
        anzahl: { description: "Anzahl gleicher Tüten" }
        wildart: { description: "Wildart, optional, z. B. Reh, Reh Bock oder Schwarzwild Frili. Setzt die aktive Wildart vor dem Druck." }
      sequence:
        - if: "{{ wildart | default('') | trim != '' }}"
          then:
            - action: rest_command.wild_art
              data:
                art: "{{ wildart | trim }}"
        - repeat:
            count: "{{ anzahl | default(1) | int(1) }}"
            sequence:
              - action: rest_command.wild_anlegen
                data:
                  teil: "{{ teil }}"
                  gewicht_g: "{{ gewicht_g | default(0) | int(0) }}"
                response_variable: antwort
              - if: "{{ not antwort.content.ok }}"
                then:
                  - variables:
                      ergebnis: "{{ antwort.content }}"
                  - stop: "Abgelehnt"
                    response_variable: ergebnis
              - variables:
                  druck:
                    gedruckt: false
              # Der B1 meldet manchmal einen Fehler, obwohl das Etikett gedruckt wurde.
              # Darum wird trotzdem eingebucht und der Fehler nur angesagt. Kam nichts: "Storno".
              - action: script.wild_etikett_rendern
                data:
                  e: "{{ antwort.content }}"
                response_variable: druck
                continue_on_error: true
              - action: rest_command.wild_gedruckt
                data:
                  nummer: "{{ antwort.content.nummer }}"
              - if: "{{ repeat.last }}"
                then:
                  - variables:
                      ergebnis: "{{ dict(antwort.content, druck_unsicher=(not druck.gedruckt)) }}"
                  - stop: "Fertig"
                    response_variable: ergebnis

    wild_sprache_art:
      alias: "Wild-Sprache: Wildart"
      mode: queued
      fields:
        art: { description: "Wildart" }
      sequence:
        - action: rest_command.wild_art
          data:
            art: "{{ art }}"
          response_variable: antwort
        - variables:
            ergebnis: "{{ antwort.content }}"
        - stop: "Fertig"
          response_variable: ergebnis

    wild_sprache_neues_stueck:
      alias: "Wild-Sprache: Neues Stück"
      mode: queued
      sequence:
        - action: rest_command.wild_neues_stueck
          response_variable: antwort
        - variables:
            ergebnis: "{{ antwort.content }}"
        - stop: "Fertig"
          response_variable: ergebnis

    wild_sprache_storno:
      alias: "Wild-Sprache: Storno"
      mode: queued
      sequence:
        - action: rest_command.wild_storno
          response_variable: antwort
        - variables:
            ergebnis: "{{ antwort.content }}"
        - stop: "Fertig"
          response_variable: ergebnis

    wild_sprache_status:
      alias: "Wild-Sprache: Status"
      mode: queued
      sequence:
        - action: rest_command.wild_status
          response_variable: antwort
        - variables:
            ergebnis: "{{ antwort.content }}"
        - stop: "Fertig"
          response_variable: ergebnis

    wild_sprache_bestand:
      alias: "Wild-Sprache: Bestand"
      mode: queued
      fields:
        teil: { description: "Teilstück, optional" }
      sequence:
        - action: rest_command.wild_bestand
          data:
            teil: "{{ teil | default('') }}"
          response_variable: antwort
        - variables:
            ergebnis: "{{ antwort.content }}"
        - stop: "Fertig"
          response_variable: ergebnis

    wild_sprache_nochmal:
      alias: "Wild-Sprache: Nochmal"
      mode: queued
      sequence:
        - action: rest_command.wild_letztes
          response_variable: antwort
        - if: "{{ not antwort.content.ok }}"
          then:
            - variables:
                ergebnis: "{{ antwort.content }}"
            - stop: "Nichts vorhanden"
              response_variable: ergebnis
        - variables:
            druck:
              gedruckt: false
        - action: script.wild_etikett_rendern
          data:
            e: "{{ antwort.content }}"
          response_variable: druck
          continue_on_error: true
        - variables:
            ergebnis: >-
              {{ antwort.content if druck.gedruckt else {'ok': false, 'fehler': 'druck'} }}
        - stop: "Fertig"
          response_variable: ergebnis

    # ---------- Wildarten für Routinen ----------
    wild_art_schwarzwild:
      alias: "Wildart Schwarzwild"
      mode: queued
      sequence:
        - action: rest_command.wild_art
          data:
            art: "Schwarzwild"
    wild_art_reh:
      alias: "Wildart Reh"
      mode: queued
      sequence:
        - action: rest_command.wild_art
          data:
            art: "Reh"
    wild_art_rotwild:
      alias: "Wildart Rotwild"
      mode: queued
      sequence:
        - action: rest_command.wild_art
          data:
            art: "Rotwild"
    wild_art_damwild:
      alias: "Wildart Damwild"
      mode: queued
      sequence:
        - action: rest_command.wild_art
          data:
            art: "Damwild"
    wild_art_muffelwild:
      alias: "Wildart Muffelwild"
      mode: queued
      sequence:
        - action: rest_command.wild_art
          data:
            art: "Muffelwild"

    # ---------- Teilstücke für Routinen ----------
    wild_teil_braten:
      alias: "Etikett Braten"
      mode: queued
      max: 20
      sequence:
        - action: script.wild_drucken
          data:
            teil: "Braten"
    wild_teil_keule:
      alias: "Etikett Keule"
      mode: queued
      max: 20
      sequence:
        - action: script.wild_drucken
          data:
            teil: "Keule"
    wild_teil_ruecken:
      alias: "Etikett Rücken"
      mode: queued
      max: 20
      sequence:
        - action: script.wild_drucken
          data:
            teil: "Rücken"
    wild_teil_filet:
      alias: "Etikett Filet"
      mode: queued
      max: 20
      sequence:
        - action: script.wild_drucken
          data:
            teil: "Filet"
    wild_teil_blatt:
      alias: "Etikett Blatt"
      mode: queued
      max: 20
      sequence:
        - action: script.wild_drucken
          data:
            teil: "Blatt"
    wild_teil_nacken:
      alias: "Etikett Nacken"
      mode: queued
      max: 20
      sequence:
        - action: script.wild_drucken
          data:
            teil: "Nacken"
    wild_teil_rippen:
      alias: "Etikett Rippen"
      mode: queued
      max: 20
      sequence:
        - action: script.wild_drucken
          data:
            teil: "Rippen"
    wild_teil_gulasch:
      alias: "Etikett Gulasch"
      mode: queued
      max: 20
      sequence:
        - action: script.wild_drucken
          data:
            teil: "Gulasch"
    wild_teil_ragout:
      alias: "Etikett Ragout"
      mode: queued
      max: 20
      sequence:
        - action: script.wild_drucken
          data:
            teil: "Ragout"
    wild_teil_hack:
      alias: "Etikett Hack"
      mode: queued
      max: 20
      sequence:
        - action: script.wild_drucken
          data:
            teil: "Hack"
    wild_teil_wurstfleisch:
      alias: "Etikett Wurstfleisch"
      mode: queued
      max: 20
      sequence:
        - action: script.wild_drucken
          data:
            teil: "Wurstfleisch"
    wild_teil_knochen:
      alias: "Etikett Knochen"
      mode: queued
      max: 20
      sequence:
        - action: script.wild_drucken
          data:
            teil: "Knochen"
    wild_teil_leber:
      alias: "Etikett Leber"
      mode: queued
      max: 20
      sequence:
        - action: script.wild_drucken
          data:
            teil: "Leber"
    wild_teil_herz:
      alias: "Etikett Herz"
      mode: queued
      max: 20
      sequence:
        - action: script.wild_drucken
          data:
            teil: "Herz"

  automation:
    - id: wild_sprache_wildart
      alias: "Wild-Sprache: Wildart"
      mode: queued
      triggers:
        - trigger: conversation
          id: "Schwarzwild"
          command:
            - "[wildart] (schwarzwild|wildschwein|sau)"
        - trigger: conversation
          id: "Reh"
          command:
            - "[wildart] (reh|re|rehwild)"
        - trigger: conversation
          id: "Rotwild"
          command:
            - "[wildart] (rotwild|hirsch)"
        - trigger: conversation
          id: "Damwild"
          command:
            - "[wildart] (damwild|damhirsch)"
        - trigger: conversation
          id: "Muffelwild"
          command:
            - "[wildart] (muffelwild|mufflon)"
        - trigger: conversation
          id: "Reh Bock"
          command:
            - "[wildart] [(reh|re)] bock"
        - trigger: conversation
          id: "Reh Ricke"
          command:
            - "[wildart] [(reh|re)] ricke"
        - trigger: conversation
          id: "Reh Kitz"
          command:
            - "[wildart] [(reh|re)] (kitz|kids|rehkitz)"
        - trigger: conversation
          id: "Schwarzwild Frili"
          command:
            - "[wildart] [schwarzwild] (frischling|frieli|frili)"
        - trigger: conversation
          id: "Schwarzwild Bache"
          command:
            - "[wildart] [schwarzwild] bache"
        - trigger: conversation
          id: "Schwarzwild Keiler"
          command:
            - "[wildart] [schwarzwild] (keiler|keile)"
      actions:
        - action: script.wild_sprache_art
          data:
            art: "{{ trigger.id }}"
          response_variable: r
        - set_conversation_response: >-
            {% if r.ok and r.neu %}{{ trigger.id }}.
            {%- elif r.ok %}{{ trigger.id }} bleibt aktiv.
            {%- else %}Das hat nicht geklappt.{% endif %}

    - id: wild_sprache_etikett
      alias: "Wild-Sprache: Etikett"
      mode: queued
      max: 20
      triggers:
        - trigger: conversation
          id: "Braten"
          command:
            - "[etikett] braten"
            - "[etikett] braten {gewicht}"
            - "(drucke|druck) [ein] [etikett] [für] braten"
            - "(drucke|druck) [ein] [etikett] [für] braten {gewicht}"
        - trigger: conversation
          id: "Braten#menge"
          command:
            - "(2|3|4|5|6|7|8|9|10|2x|3x|4x|5x|6x|7x|8x|9x|10x|2mal|3mal|4mal|5mal|6mal|7mal|8mal|9mal|10mal|zwei|drei|vier|fünf|sechs|sieben|acht|neun|zehn|zweimal|dreimal|viermal|fünfmal|sechsmal|siebenmal|achtmal|neunmal|zehnmal) [mal] braten"
            - "(2|3|4|5|6|7|8|9|10|2x|3x|4x|5x|6x|7x|8x|9x|10x|2mal|3mal|4mal|5mal|6mal|7mal|8mal|9mal|10mal|zwei|drei|vier|fünf|sechs|sieben|acht|neun|zehn|zweimal|dreimal|viermal|fünfmal|sechsmal|siebenmal|achtmal|neunmal|zehnmal) [mal] braten {gewicht}"
        - trigger: conversation
          id: "Braten#drucke"
          command:
            - "(drucke|druck) (2|3|4|5|6|7|8|9|10|zwei|drei|vier|fünf|sechs|sieben|acht|neun|zehn) (etikett|etiketten) [für] braten"
            - "(drucke|druck) (2|3|4|5|6|7|8|9|10|zwei|drei|vier|fünf|sechs|sieben|acht|neun|zehn) (etikett|etiketten) [für] braten {gewicht}"
        - trigger: conversation
          id: "Keule"
          command:
            - "[etikett] (keule|schlegel)"
            - "[etikett] (keule|schlegel) {gewicht}"
            - "(drucke|druck) [ein] [etikett] [für] (keule|schlegel)"
            - "(drucke|druck) [ein] [etikett] [für] (keule|schlegel) {gewicht}"
        - trigger: conversation
          id: "Keule#menge"
          command:
            - "(2|3|4|5|6|7|8|9|10|2x|3x|4x|5x|6x|7x|8x|9x|10x|2mal|3mal|4mal|5mal|6mal|7mal|8mal|9mal|10mal|zwei|drei|vier|fünf|sechs|sieben|acht|neun|zehn|zweimal|dreimal|viermal|fünfmal|sechsmal|siebenmal|achtmal|neunmal|zehnmal) [mal] (keule|schlegel)"
            - "(2|3|4|5|6|7|8|9|10|2x|3x|4x|5x|6x|7x|8x|9x|10x|2mal|3mal|4mal|5mal|6mal|7mal|8mal|9mal|10mal|zwei|drei|vier|fünf|sechs|sieben|acht|neun|zehn|zweimal|dreimal|viermal|fünfmal|sechsmal|siebenmal|achtmal|neunmal|zehnmal) [mal] (keule|schlegel) {gewicht}"
        - trigger: conversation
          id: "Keule#drucke"
          command:
            - "(drucke|druck) (2|3|4|5|6|7|8|9|10|zwei|drei|vier|fünf|sechs|sieben|acht|neun|zehn) (etikett|etiketten) [für] (keule|schlegel)"
            - "(drucke|druck) (2|3|4|5|6|7|8|9|10|zwei|drei|vier|fünf|sechs|sieben|acht|neun|zehn) (etikett|etiketten) [für] (keule|schlegel) {gewicht}"
        - trigger: conversation
          id: "Rücken"
          command:
            - "[etikett] rücken"
            - "[etikett] rücken {gewicht}"
            - "(drucke|druck) [ein] [etikett] [für] rücken"
            - "(drucke|druck) [ein] [etikett] [für] rücken {gewicht}"
        - trigger: conversation
          id: "Rücken#menge"
          command:
            - "(2|3|4|5|6|7|8|9|10|2x|3x|4x|5x|6x|7x|8x|9x|10x|2mal|3mal|4mal|5mal|6mal|7mal|8mal|9mal|10mal|zwei|drei|vier|fünf|sechs|sieben|acht|neun|zehn|zweimal|dreimal|viermal|fünfmal|sechsmal|siebenmal|achtmal|neunmal|zehnmal) [mal] rücken"
            - "(2|3|4|5|6|7|8|9|10|2x|3x|4x|5x|6x|7x|8x|9x|10x|2mal|3mal|4mal|5mal|6mal|7mal|8mal|9mal|10mal|zwei|drei|vier|fünf|sechs|sieben|acht|neun|zehn|zweimal|dreimal|viermal|fünfmal|sechsmal|siebenmal|achtmal|neunmal|zehnmal) [mal] rücken {gewicht}"
        - trigger: conversation
          id: "Rücken#drucke"
          command:
            - "(drucke|druck) (2|3|4|5|6|7|8|9|10|zwei|drei|vier|fünf|sechs|sieben|acht|neun|zehn) (etikett|etiketten) [für] rücken"
            - "(drucke|druck) (2|3|4|5|6|7|8|9|10|zwei|drei|vier|fünf|sechs|sieben|acht|neun|zehn) (etikett|etiketten) [für] rücken {gewicht}"
        - trigger: conversation
          id: "Filet"
          command:
            - "[etikett] (filet|lende)"
            - "[etikett] (filet|lende) {gewicht}"
            - "(drucke|druck) [ein] [etikett] [für] (filet|lende)"
            - "(drucke|druck) [ein] [etikett] [für] (filet|lende) {gewicht}"
        - trigger: conversation
          id: "Filet#menge"
          command:
            - "(2|3|4|5|6|7|8|9|10|2x|3x|4x|5x|6x|7x|8x|9x|10x|2mal|3mal|4mal|5mal|6mal|7mal|8mal|9mal|10mal|zwei|drei|vier|fünf|sechs|sieben|acht|neun|zehn|zweimal|dreimal|viermal|fünfmal|sechsmal|siebenmal|achtmal|neunmal|zehnmal) [mal] (filet|lende)"
            - "(2|3|4|5|6|7|8|9|10|2x|3x|4x|5x|6x|7x|8x|9x|10x|2mal|3mal|4mal|5mal|6mal|7mal|8mal|9mal|10mal|zwei|drei|vier|fünf|sechs|sieben|acht|neun|zehn|zweimal|dreimal|viermal|fünfmal|sechsmal|siebenmal|achtmal|neunmal|zehnmal) [mal] (filet|lende) {gewicht}"
        - trigger: conversation
          id: "Filet#drucke"
          command:
            - "(drucke|druck) (2|3|4|5|6|7|8|9|10|zwei|drei|vier|fünf|sechs|sieben|acht|neun|zehn) (etikett|etiketten) [für] (filet|lende)"
            - "(drucke|druck) (2|3|4|5|6|7|8|9|10|zwei|drei|vier|fünf|sechs|sieben|acht|neun|zehn) (etikett|etiketten) [für] (filet|lende) {gewicht}"
        - trigger: conversation
          id: "Blatt"
          command:
            - "[etikett] (blatt|schulter)"
            - "[etikett] (blatt|schulter) {gewicht}"
            - "(drucke|druck) [ein] [etikett] [für] (blatt|schulter)"
            - "(drucke|druck) [ein] [etikett] [für] (blatt|schulter) {gewicht}"
        - trigger: conversation
          id: "Blatt#menge"
