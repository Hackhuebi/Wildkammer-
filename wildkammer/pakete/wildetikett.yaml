            - "(2|3|4|5|6|7|8|9|10|2x|3x|4x|5x|6x|7x|8x|9x|10x|2mal|3mal|4mal|5mal|6mal|7mal|8mal|9mal|10mal|zwei|drei|vier|fünf|sechs|sieben|acht|neun|zehn|zweimal|dreimal|viermal|fünfmal|sechsmal|siebenmal|achtmal|neunmal|zehnmal) [mal] (nuss|nuß)"
            - "(2|3|4|5|6|7|8|9|10|2x|3x|4x|5x|6x|7x|8x|9x|10x|2mal|3mal|4mal|5mal|6mal|7mal|8mal|9mal|10mal|zwei|drei|vier|fünf|sechs|sieben|acht|neun|zehn|zweimal|dreimal|viermal|fünfmal|sechsmal|siebenmal|achtmal|neunmal|zehnmal) [mal] (nuss|nuß) {gewicht}"
        - trigger: conversation
          id: "Nuss#drucke"
          command:
            - "(drucke|druck) (2|3|4|5|6|7|8|9|10|zwei|drei|vier|fünf|sechs|sieben|acht|neun|zehn) (etikett|etiketten) [für] (nuss|nuß)"
            - "(drucke|druck) (2|3|4|5|6|7|8|9|10|zwei|drei|vier|fünf|sechs|sieben|acht|neun|zehn) (etikett|etiketten) [für] (nuss|nuß) {gewicht}"
        - trigger: conversation
          id: "Hüfte"
          command:
            - "[etikett] (hüfte|huefte)"
            - "[etikett] (hüfte|huefte) {gewicht}"
            - "(drucke|druck) [ein] [etikett] [für] (hüfte|huefte)"
            - "(drucke|druck) [ein] [etikett] [für] (hüfte|huefte) {gewicht}"
        - trigger: conversation
          id: "Hüfte#menge"
          command:
            - "(2|3|4|5|6|7|8|9|10|2x|3x|4x|5x|6x|7x|8x|9x|10x|2mal|3mal|4mal|5mal|6mal|7mal|8mal|9mal|10mal|zwei|drei|vier|fünf|sechs|sieben|acht|neun|zehn|zweimal|dreimal|viermal|fünfmal|sechsmal|siebenmal|achtmal|neunmal|zehnmal) [mal] (hüfte|huefte)"
            - "(2|3|4|5|6|7|8|9|10|2x|3x|4x|5x|6x|7x|8x|9x|10x|2mal|3mal|4mal|5mal|6mal|7mal|8mal|9mal|10mal|zwei|drei|vier|fünf|sechs|sieben|acht|neun|zehn|zweimal|dreimal|viermal|fünfmal|sechsmal|siebenmal|achtmal|neunmal|zehnmal) [mal] (hüfte|huefte) {gewicht}"
        - trigger: conversation
          id: "Hüfte#drucke"
          command:
            - "(drucke|druck) (2|3|4|5|6|7|8|9|10|zwei|drei|vier|fünf|sechs|sieben|acht|neun|zehn) (etikett|etiketten) [für] (hüfte|huefte)"
            - "(drucke|druck) (2|3|4|5|6|7|8|9|10|zwei|drei|vier|fünf|sechs|sieben|acht|neun|zehn) (etikett|etiketten) [für] (hüfte|huefte) {gewicht}"
      actions:
        - action: rest_command.wild_eingabe
          data:
            gewicht: "{{ trigger.slots.gewicht | default('') }}"
            # Bei "drucke 5 etiketten" steht die Menge im zweiten Wort, sonst im ersten.
            menge: >-
              {% set w = trigger.sentence.split(' ') %}
              {{ w[1] if '#drucke' in trigger.id else w[0] if '#menge' in trigger.id else '' }}
          response_variable: eingabe
        - if: "{{ not eingabe.content.ok }}"
          then:
            - set_conversation_response: >-
                {% if eingabe.content.fehler == 'gewicht_ungueltig' %}Das Gewicht habe ich nicht verstanden.
                {%- elif eingabe.content.fehler == 'menge_ungueltig' %}Die Menge habe ich nicht verstanden.
                {%- else %}Die Wildkammer hat einen Fehler gemeldet.{% endif %} Es wurde nichts gedruckt.
            - stop: "Eingabe nicht verstanden"
        - action: script.wild_sprache_etikett
          data:
            teil: "{{ trigger.id.split('#')[0] }}"
            gewicht_g: "{{ eingabe.content.gewicht_g }}"
            anzahl: "{{ eingabe.content.anzahl }}"
          response_variable: r
        - set_conversation_response: >-
            {% if r.ok %}
            {%- if eingabe.content.anzahl > 1 %}{{ eingabe.content.anzahl }} mal {% endif -%}
            {{ trigger.id.split('#')[0] }}
            {%- set g = eingabe.content.gewicht_g %}
            {%- if g and g < 1000 %}, {{ g }} Gramm
            {%- elif g %}, {{ (g / 1000) | string | replace('.', ',') }} Kilo{% endif %}, {{ r.art }}.
            {%- if r.druck_unsicher %} Der Drucker hat einen Fehler gemeldet, eingebucht ist es trotzdem. Kam kein Etikett, sag Storno.{% endif %}
            {%- elif r.fehler == 'wildart_fehlt' %}Erst die Wildart sagen.
            {%- elif r.fehler == 'druck' %}Der Drucker hat nicht gedruckt. Bitte prüfen und noch einmal sagen.
            {%- else %}Das hat nicht geklappt.{% endif %}

