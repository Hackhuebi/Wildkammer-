    wildkammer_wurst_etikett_rendern:
      alias: Wildkammer Wurstetikett rendern
      mode: queued
      max: 50
      fields:
        a:
          description: Druckauftrag aus der Wildkammer
      sequence:
      - action: niimbot.print
        target:
          device_id: 9cea996fbc0962ebe6d27af33baf87e9
        data:
          width: 384
          height: 240
          density: 3
          payload:
          - type: text
            value: "{{ a.zeile1 }}"
            x: 8
            y: 70
            size: "{{ 46 if a.zeile1 | length <= 8 else 34 if a.zeile1 | length <= 12 else 30 }}"
          - type: text
            value: "{{ a.zeile2 or ' ' }}"
            x: 8
            y: 134
            size: 26
          - type: text
            value: "{{ a.code }}"
            x: 8
            y: 204
            size: 24
          - type: qrcode
            data: "http://192.168.178.60:8099/w/{{ a.nummer }}"
            x: 236
            y: 44
            boxsize: 4
            border: 4
            eclevel: m
          - type: text
            value: "{{ a.datum }}"
            x: 244
            y: 204
            size: 24
      - variables:
          fertig:
            gedruckt: true
      - stop: Gedruckt
        response_variable: fertig
    wildkammer_wurst_etiketten:
      alias: Wildkammer Wurstetiketten drucken
      description: Druckt Etiketten für fertige Wurst auf dem Etikettendrucker und bucht jede gedruckte Packung ins Lager. Statt zusätzlich einzubuchen.
      mode: queued
      max: 5
      fields:
        produkt:
          name: produkt
          description: Produkt
          required: true
          selector:
            text:
        anzahl:
          name: anzahl
          description: Anzahl Etiketten (1 bis 50)
          required: true
          selector:
            number:
              min: 1
              max: 50
              mode: box
      sequence:
      - variables:
          gedruckt: 0
          unsicher: 0
      - repeat:
          count: "{{ [anzahl | int(1), 50] | min }}"
          sequence:
          - action: rest_command.wildkammer_wurst_auftrag
            data:
              produkt: "{{ produkt }}"
            response_variable: auftrag
          - if: "{{ not auftrag.content.ok }}"
            then:
            - variables:
                ergebnis: "{{ auftrag.content }}"
            - stop: Produkt unklar
              response_variable: ergebnis
          - variables:
              druck:
                gedruckt: false
          - action: script.wildkammer_wurst_etikett_rendern
            data:
              a: "{{ auftrag.content }}"
            response_variable: druck
            continue_on_error: true
          - variables:
              unsicher: "{{ unsicher + (0 if druck.gedruckt else 1) }}"
          - action: rest_command.wildkammer_wurst_gedruckt
            data:
              auftrag: "{{ auftrag.content.auftrag }}"
          - variables:
              gedruckt: "{{ gedruckt + 1 }}"
      - variables:
          ergebnis:
            ok: true
            gedruckt: "{{ gedruckt }}"
            druck_unsicher: "{{ unsicher }}"
      - stop: Fertig
        response_variable: ergebnis
